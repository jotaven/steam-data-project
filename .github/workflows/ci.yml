name: Python CI (Linting & Formatting)

on:
  push:
    branches: [ main ]
  
  pull_request:
    branches: [ main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"] 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-python-${{ matrix.python-version }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-python-${{ matrix.python-version }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install linting tools
      run: |
        pip install flake8 black

    - name: Run Black formatter check
      run: |
        black --check . --exclude="venv|notebooks|app/app.py"
    
    - name: Run Flake8 linter
      run: |
        # --count: mostra o total de erros
        # --select: reporta apenas erros E9,F63,F7,F82 (erros de sintaxe, etc.)
        # --show-source: mostra a linha com erro
        # Opcional: para ser menos estrito, use apenas 'flake8 . --exclude=venv'
        flake8 . --exclude=venv --count --select=E9,F63,F7,F82 --show-source --statistics